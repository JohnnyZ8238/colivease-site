name: Tell search engines (IndexNow)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Send every page in the sitemap, not only new and changed ones
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for GitHub Pages to publish
        run: sleep 120
      - name: Send new, changed and removed pages
        env:
          INDEXNOW_HOST: www.colivease.ca
          INDEXNOW_KEY: c0f1e7a5e4b94d6a9e2f3b7c8d1a6e40
        run: node .github/indexnow.mjs ${{ inputs.all && '--all' || '' }}
