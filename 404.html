<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="8; url=/">
<title>Page not found · ColivEase</title>
<link rel="icon" href="/favicon.ico">
<style>
:root { color-scheme: light; --bg: #F5F7FB; --card: #FFFFFF; --ink: #0B2255; --muted: #5B6B86; --link: #2865FF; --line: #DBE4F3; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #0E1626; --card: #152038; --ink: #E8EEFB; --muted: #9FB0CC; --link: #8FB0FF; --line: #24324F; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.6 "Poppins", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
main { width: 100%; max-width: 440px; padding: 32px 26px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); text-align: center; }
h1 { margin: 0 0 6px; font-size: 24px; line-height: 1.3; }
p { margin: 0 0 22px; color: var(--muted); }
nav { display: grid; gap: 10px; }
a { color: var(--link); }
a.home { padding: 12px; border-radius: 14px; background: #2865FF; color: #fff; font-weight: 600; text-decoration: none; }
a:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
small { display: block; margin-top: 20px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Page not found<br>页面不存在</h1>
  <p>This link doesn't exist or has moved.<br>这个链接不存在或已经移动。</p>
  <nav>
    <a class="home" href="/">Home · 首页</a>
    <a href="/app.html">Open ColivEase · 打开应用</a>
    <a href="/blog/">Renter guides · 租房指南</a>
    <a href="/legal/terms.html">Terms of Use · 用户协议</a>
    <a href="/legal/privacy.html">Privacy Policy · 隐私政策</a>
  </nav>
  <small>Going home in a few seconds · 几秒后回到首页</small>
</main>
</body>
</html>
